  <title
   id="title1">Open yellow folder with white sheets</title>
  <desc
   id="desc1">Illustration 100 % vectorielle. Variante vert turquoise + violet renforcée. Le cube extérieur utilise 6 nuances distinctes de turquoise. Le cube intérieur en creux utilise 3 nuances violettes plus contrastées. Les sommets partagés du logo conservent exactement les mêmes coordonnées numériques.</desc>
  
