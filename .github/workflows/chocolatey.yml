name: Submit FileSpacer to Chocolatey

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      retry:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
    secrets:
      CHOCO_API_KEY:
        required: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: windows-2022
    timeout-minutes: 40
    # Serialize the whole decision/package/reservation/submission transaction.
    # Native run queuing must not discard a release in favor of a scheduled check.
    concurrency:
      group: distribution-chocolatey
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DISTRIBUTION_CHANNEL: chocolatey
      RETRY_SUBMISSION: ${{ inputs.retry }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Reconcile moderation and retain the latest pending release
        id: queue
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/distribution-queue.mjs plan
      - name: Test package generation
        if: steps.queue.outputs.submit == 'true'
        shell: cmd
        run: node --test .github/scripts/chocolatey.test.mjs .github/scripts/winget.test.mjs
      - name: Prepare the package from verified public release assets
        if: steps.queue.outputs.submit == 'true'
        id: prepare
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/chocolatey.mjs
      - name: Build the Chocolatey package
        if: steps.queue.outputs.submit == 'true'
        id: package
        shell: pwsh
        run: |
          choco pack build/chocolatey/filespacer/filespacer.nuspec --output-directory build/chocolatey --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey packaging failed.' }
      - name: Preserve the package for review
        if: steps.queue.outputs.submit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chocolatey-${{ env.RELEASE_TAG }}
          path: build/chocolatey
          if-no-files-found: error
      - name: Smoke test the real installation on the disposable runner
        if: steps.queue.outputs.submit == 'true'
        id: smoke
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          choco install filespacer --version "$env:PACKAGE_VERSION" --source "$env:GITHUB_WORKSPACE/build/chocolatey" --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey installation failed.' }
          $installed = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\FileSpacer'
          if ($installed.DisplayVersion -cne $env:PACKAGE_VERSION -or !(Test-Path -LiteralPath (Join-Path $installed.InstallLocation 'FileSpacer.exe') -PathType Leaf)) {
            throw 'The installed FileSpacer version or executable does not match the package.'
          }
      - name: Smoke test uninstallation and clean up the runner
        if: steps.queue.outputs.submit == 'true' && (always() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != '')
        shell: pwsh
        run: |
          choco uninstall filespacer --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey uninstallation failed.' }
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\FileSpacer') {
            throw 'FileSpacer remains registered after uninstallation.'
          }
      - name: Submit the package to the Chocolatey community repository
        id: submit
        if: steps.queue.outputs.submit == 'true' && (!inputs.dry_run)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          PACKAGE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          if (!$env:CHOCO_API_KEY) { throw 'Configure the CHOCO_API_KEY Actions secret, then retry this workflow. The package is available in the artifact.' }
          node .github/scripts/distribution-queue.mjs begin
          if ($LASTEXITCODE -ne 0) { throw 'Could not reserve the distribution queue.' }
          choco push "build/chocolatey/filespacer.$env:PACKAGE_VERSION.nupkg" --source https://push.chocolatey.org/ --api-key "$env:CHOCO_API_KEY" --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey submission failed. Check the package page for an existing submission or moderation feedback before retrying.' }
          "Submitted filespacer $env:PACKAGE_VERSION. Availability requires Chocolatey moderation: https://community.chocolatey.org/packages/filespacer/$env:PACKAGE_VERSION" >> $env:GITHUB_STEP_SUMMARY
      - name: Record the successful submission
        if: steps.submit.outcome == 'success'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/distribution-queue.mjs submitted
      - name: Report durable queue state
        if: always() && !inputs.dry_run
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/distribution-queue.mjs report
