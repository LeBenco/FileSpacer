name: Submit FileSpacer to WinGet

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      retry:
        type: boolean
        default: false
    secrets:
      WINGET_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: windows-2022
    timeout-minutes: 20
    # Serialize the whole decision/package/reservation/submission transaction.
    # Native run queuing must not discard a release in favor of a scheduled check.
    concurrency:
      group: distribution-winget
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DISTRIBUTION_CHANNEL: winget
      RETRY_SUBMISSION: ${{ inputs.retry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Reconcile moderation and retain the latest pending release
        id: queue
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/distribution-queue.mjs plan
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: steps.queue.outputs.submit == 'true'
        with:
          dotnet-version: 9.0.x
      - name: Test manifest generation
        if: steps.queue.outputs.submit == 'true'
        shell: cmd
        run: node --test .github/scripts/winget.test.mjs
      - name: Prepare manifests from the published installer
        if: steps.queue.outputs.submit == 'true'
        id: prepare
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/winget.mjs
      - name: Preserve manifests for review
        if: steps.queue.outputs.submit == 'true' && (steps.prepare.outputs.submit == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-${{ env.RELEASE_TAG }}
          path: build/winget
          if-no-files-found: error
      - name: Validate and submit to the WinGet community repository
        id: submit
        if: steps.queue.outputs.submit == 'true' && (steps.prepare.outputs.submit == 'true')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (!$env:WINGET_CREATE_GITHUB_TOKEN) {
            throw 'Configure the WINGET_TOKEN Actions secret (classic PAT with public_repo). The release is published; manifests are available in the workflow artifact. Rerun this workflow after configuring the secret.'
          }
          $tool = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' -OutFile $tool
          if ((Get-FileHash $tool -Algorithm SHA256).Hash -ine '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea') {
            throw 'WingetCreate checksum mismatch.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $tool
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') {
            throw 'WingetCreate must have a valid Microsoft signature.'
          }
          node .github/scripts/distribution-queue.mjs begin
          if ($LASTEXITCODE -ne 0) { throw 'Could not reserve the distribution queue.' }
          # submit validates the complete manifest set before creating the PR.
          & $tool submit --no-open --prtitle "New version: Benco.FileSpacer version $($env:RELEASE_TAG.Substring(1))" build/winget | Tee-Object -FilePath build/winget-submit.log
          if ($LASTEXITCODE -ne 0) { throw 'WinGet validation/submission failed. See WingetCreate diagnostics above.' }
          'WinGet PR submitted. Catalog availability requires approval by microsoft/winget-pkgs.' >> $env:GITHUB_STEP_SUMMARY
      - name: Record the successful submission
        if: steps.submit.outcome == 'success'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/distribution-queue.mjs submitted build/winget-submit.log
      - name: Report durable queue state
        if: always()
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/distribution-queue.mjs report
