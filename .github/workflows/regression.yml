name: Test FileSpacer regressions
run-name: Regression tests - ${{ inputs.ref }} - ${{ inputs.category }} - ${{ inputs.pattern }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to test (uses that revision of sources and tests)'
        required: true
        default: main
        type: string
      category:
        description: 'Test category'
        required: true
        default: All
        type: choice
        options:
          - All
          - Internal
          - UI
      pattern:
        description: 'Case pattern, for example 16-redimensionnement-alt\03-*'
        required: true
        default: '*'
        type: string

  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      category:
        default: All
        type: string
      pattern:
        default: '*'
        type: string

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      ui: ${{ steps.select.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: select
        name: Resolve revision and select cases before preparing dependencies
        shell: pwsh
        env:
          TEST_SCOPE: Application
          TEST_CATEGORY: ${{ inputs.category }}
          TEST_PATTERN: ${{ inputs.pattern }}
        run: |
          $cases = & ./tests/regression/Run-Regression.ps1 -ListOnly -Scope $env:TEST_SCOPE -Category $env:TEST_CATEGORY -Pattern $env:TEST_PATTERN | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$cases) { throw 'Case selection failed.' }
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "ui=$((@($cases | Where-Object Category -eq 'UI').Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "Selected $(@($cases).Count) cases, scope=$env:TEST_SCOPE, category=$env:TEST_CATEGORY, pattern=$env:TEST_PATTERN" >> $env:GITHUB_STEP_SUMMARY

  regression:
    needs: selection
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      TEST_SHA: ${{ needs.selection.outputs.sha }}
      TEST_SCOPE: Application
      TEST_UI: ${{ needs.selection.outputs.ui }}
      TEST_CATEGORY: ${{ inputs.category }}
      TEST_PATTERN: ${{ inputs.pattern }}
      # Keep Windows PowerShell 5.1 modules when the parent uses PowerShell 7.
      PSModulePath: C:\Windows\System32\WindowsPowerShell\v1.0\Modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          # The legacy-provider regression builds sources from the v1.2.2 tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Record revision and desktop environment
        shell: powershell
        run: |
          "TEST_DIRECTORY=$(Join-Path $env:RUNNER_TEMP 'fs')" | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          New-Item -ItemType Directory -Path build/ci -Force | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          Add-Type -AssemblyName System.Windows.Forms
          $environment = [ordered]@{
            Commit = $env:TEST_SHA
            Scope = $env:TEST_SCOPE
            Category = $env:TEST_CATEGORY
            Pattern = $env:TEST_PATTERN
            OS = (Get-CimInstance Win32_OperatingSystem).Caption
            ImageVersion = $env:ImageVersion
            PowerShell = $PSVersionTable.PSVersion.ToString()
            Interactive = [Environment]::UserInteractive
            SessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
            Administrator = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            Screens = @([Windows.Forms.Screen]::AllScreens | ForEach-Object { $_.Bounds.ToString() })
          }
          $environment | ConvertTo-Json -Depth 4 | Set-Content build/ci/environment.json -Encoding UTF8
          $environment | Format-List | Out-String | Write-Host
          if ($env:TEST_UI -eq 'true' -and !$environment.Interactive) {
            throw 'UI tests require an interactive runner desktop.'
          }
          $runner = Get-Content tests/regression/Run-Regression.ps1 -Raw
          if ($runner -notmatch '\[switch\]\$CI\b') {
            throw 'This revision predates the -CI launcher. Select a revision containing CI support.'
          }

      - name: Verify the limited worker before installing dependencies
        shell: powershell
        run: |
          Add-Type -Path tests/regression/common/CIRestrictedProcess.cs
          $probe = @'
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          $record = @{UserSid=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value;Administrator=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator);Interactive=[Environment]::UserInteractive;SessionId=[Diagnostics.Process]::GetCurrentProcess().SessionId}
          $record | ConvertTo-Json | Set-Content build/ci/limited-worker.json -Encoding UTF8
          if ($record.Administrator -or !$record.Interactive) { exit 1 }
          $shell = New-Object -ComObject Shell.Application
          $windows = $shell.Windows()
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($windows)
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($shell)
          '@
          $probePath = Join-Path $PWD 'build/ci/limited-worker.ps1'
          $probe | Set-Content $probePath -Encoding UTF8
          $arguments = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "' + $probePath + '"'
          $exitCode = [FileSpacerRegression.CIRestrictedProcess]::Run((Join-Path $PSHOME 'powershell.exe'),$arguments,$PWD.Path,15000)
          if ($exitCode -ne 0) { throw ('Limited worker startup failed: {0} (0x{0:X8})' -f $exitCode) }
          $result = Get-Content build/ci/limited-worker.json -Raw | ConvertFrom-Json
          $result | Format-List | Out-String | Write-Host
          if ($result.SessionId -ne [Diagnostics.Process]::GetCurrentProcess().SessionId) { throw 'Limited worker changed desktop session.' }

      - name: Install test dependencies and locate MSVC
        shell: powershell
        run: |
          choco install inkscape imagemagick --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed.' }
          if ($env:TEST_UI -eq 'true') {
            choco install everything --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Everything installation failed.' }
            # Remove installer-started clients from this disposable runner before
            # tests start. Do not rely on IPC to an instance still initializing.
            # Match the installed image and session; leave the service alone.
            $everything = Join-Path $env:ProgramFiles 'Everything\Everything.exe'
            $session = [Diagnostics.Process]::GetCurrentProcess().SessionId
            $started = @(Get-Process Everything -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $session -and $_.Path -eq $everything })
            foreach ($process in $started) {
              if (!$process.HasExited) { Stop-Process -InputObject $process -Force -ErrorAction Stop }
              if (!$process.WaitForExit(15000)) { throw 'The installed Everything instance did not exit.' }
            }
            if (@(Get-Process Everything -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $session }).Count) {
              throw 'Everything is still running in the test session.'
            }
          }
          # Chocolatey changes the machine PATH after this process was created.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.ATL -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'MSVC x64 with ATL was not found.' }
          "VS_INSTALL=$vs" | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          $env:Path.Split(';') | Where-Object { $_ } | Out-File $env:GITHUB_PATH -Append -Encoding UTF8
          & $vswhere -latest -products '*' -format json | Set-Content build/ci/msvc.json -Encoding UTF8

      - name: Build Debug with MSVC and NMAKE
        shell: cmd
        run: |
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          nmake.exe /nologo /f Makefile CFG=Debug > build\ci\build-debug.log 2>&1
          if errorlevel 1 (type build\ci\build-debug.log & exit /b 1)
      - name: Run the selected regression cases
        shell: cmd
        run: |
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "& '.\tests\regression\Run-Regression.ps1' -CI -Scope $env:TEST_SCOPE -Category $env:TEST_CATEGORY -Pattern $env:TEST_PATTERN -RunDirectory $env:TEST_DIRECTORY"
          exit /b %errorlevel%

      - name: Report the result
        if: always()
        shell: powershell
        run: |
          & ./tests/regression/common/Write-RegressionSummary.ps1 -RunDirectory $env:TEST_DIRECTORY -Commit $env:TEST_SHA -Scope $env:TEST_SCOPE

      - name: Preserve logs, reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci
            ${{ env.TEST_DIRECTORY }}/preparation.log
            ${{ env.TEST_DIRECTORY }}/runner.*.log
            ${{ env.TEST_DIRECTORY }}/worker-result.json
            ${{ env.TEST_DIRECTORY }}/output
          if-no-files-found: warn
          retention-days: 14
