name: Publish FileSpacer website

on:
  # Branch pushes and explicit dispatches publish the live site. After a release,
  # the release-links workflow dispatches a refresh following its README commit.
  push:
    branches: [main]
    paths:
      - '**/README.md'
      - BUILD.md
      - docs/**
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - src/res/FileSpacer.svg
      - website/**
      - .github/scripts/**
      - .github/actions/build-docs/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - '**/README.md'
      - BUILD.md
      - docs/**
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - src/res/FileSpacer.svg
      - website/**
      - .github/scripts/**
      - .github/actions/build-docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-docs
        with:
          target: web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
