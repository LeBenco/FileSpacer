name: Publish FileSpacer website

on:
  workflow_run:
    workflows: [Publish FileSpacer]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '**/README.md'
      - BUILD.md
      - docs/**
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - src/res/FileSpacer.svg
      - website/**
      - .github/scripts/**
      - .github/actions/build-docs/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - '**/README.md'
      - BUILD.md
      - docs/**
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - src/res/FileSpacer.svg
      - website/**
      - .github/scripts/**
      - .github/actions/build-docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-links:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Test installer link updates
        run: python3 .github/scripts/update-release-links.test.py
      - name: Update links to the latest published installer
        run: |
          mkdir -p build
          gh api "repos/$GH_REPO/releases/latest" > build/latest-release.json
          python3 .github/scripts/update-release-links.py build/latest-release.json
      - name: Commit and push updated links
        run: |
          tag=$(jq -r .tag_name build/latest-release.json)
          git config user.name Benco
          git config user.email 76206340+LeBenco@users.noreply.github.com
          git add -- README.md docs/*/README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(readme): link the $tag installer"
          fi
          git add -- docs/*/source-state.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(translations): record the updated installer link reference"
          fi
          git push origin "HEAD:$DEFAULT_BRANCH"

  build:
    needs: update-links
    if: always() && !cancelled() && (needs.update-links.result == 'success' || needs.update-links.result == 'skipped') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read main after the link update; PRs still build their merge ref.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-docs
        with:
          target: web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
